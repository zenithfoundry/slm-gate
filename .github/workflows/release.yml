# Releases. release-please reads the Conventional Commits on main and keeps a release PR open with the
# next SemVer version and its CHANGELOG entry. Merging that PR tags vX.Y.Z and publishes the GitHub
# Release; the assets job then attaches the package tarball, an SPDX SBOM and a signed provenance bundle.
#
# release-please acts as the zenithfoundry-slm-gate-release GitHub App (repo variable RELEASE_APP_CLIENT_ID, secret
# RELEASE_APP_PRIVATE_KEY), not the job token: events made with the job token start no other workflows,
# whereas the App's release PR runs CI and CodeQL like any other pull request.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The release App's token does the writing (contents, pull requests, issues), so the job token needs
    # nothing.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: node

  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload the release assets
      id-token: write      # sign the provenance with this workflow's identity
      attestations: write  # store the attestation for `gh attestation verify`
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm run build && pnpm test

      - name: Pack
        run: pnpm pack

      - name: SBOM (SPDX, from the dependency graph)
        run: gh api "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" --jq .sbom > "slm-gate-$VERSION.spdx.json"

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            zenithfoundry-slm-gate-*.tgz
            slm-gate-*.spdx.json

      - name: Attach to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "slm-gate-$VERSION.sigstore.json"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "zenithfoundry-slm-gate-$VERSION.tgz" "slm-gate-$VERSION.spdx.json" "slm-gate-$VERSION.sigstore.json"

  # Stages the release's own signed tarball on npm, unchanged; a maintainer then makes it public with 2FA:
  # `npm stage list @zenithfoundry/slm-gate`, then `npm stage approve <stage-id>` (or approve it on npmjs.com).
  # Off until the repo variable NPM_PUBLISH is `on`. npm trusts this job through the package's trusted
  # publisher (zenithfoundry/slm-gate, release.yml), which allows `npm stage publish` only, so no workflow
  # can make a version public without that approval. npm adds provenance on its own.
  npm-publish:
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH == 'on' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read       # download the release's tarball
      attestations: read   # check its signature
      id-token: write      # npm trusted publishing
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Node 24 ships npm 11.15 or newer, which trusted publishing and `npm stage` need.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download the release's tarball and check its signature
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "zenithfoundry-slm-gate-$VERSION.tgz"
          gh attestation verify "zenithfoundry-slm-gate-$VERSION.tgz" --repo "$GITHUB_REPOSITORY"

      - name: Stage on npm (a maintainer approves it with 2FA to publish)
        run: npm stage publish "zenithfoundry-slm-gate-$VERSION.tgz" --access public
