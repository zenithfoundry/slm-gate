# Releases. release-please reads the Conventional Commits on main and keeps a release PR open with the
# next SemVer version and its CHANGELOG entry. Merging that PR tags vX.Y.Z and publishes the GitHub
# Release; the assets job then attaches the package tarball, an SPDX SBOM and a signed provenance bundle.
#
# Requires "Allow GitHub Actions to create and approve pull requests" (org and repo Actions settings),
# or release-please cannot open its PR. Events made with the job token start no other workflows, so CI
# does not run on the release PR; it only changes the version and CHANGELOG, and the assets job builds
# and tests before attaching anything.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # release branch, tag and GitHub Release
      pull-requests: write  # open and update the release PR
      issues: write         # label the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          # First release only: package.json already says 1.0.0. Remove once v1.0.0 exists, or every
          # later release is forced to 1.0.0 again.
          release-as: 1.0.0

  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload the release assets
      id-token: write      # sign the provenance with this workflow's identity
      attestations: write  # store the attestation for `gh attestation verify`
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm run build && pnpm test

      - name: Pack
        run: pnpm pack

      - name: SBOM (SPDX, from the dependency graph)
        run: gh api "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" --jq .sbom > "slm-gate-$VERSION.spdx.json"

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            zenithfoundry-slm-gate-*.tgz
            slm-gate-*.spdx.json

      - name: Attach to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "slm-gate-$VERSION.sigstore.json"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "zenithfoundry-slm-gate-$VERSION.tgz" "slm-gate-$VERSION.spdx.json" "slm-gate-$VERSION.sigstore.json"
