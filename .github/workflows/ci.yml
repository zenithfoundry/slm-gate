name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Tests only read the repo; this stops the job token having write access it doesn't need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Node release with better-sqlite3 prebuilds; 26 is the version that broke
        # the install in issue "better-sqlite3 fails to build on Node 26".
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # pnpm 10 reads build-script policy from pnpm-workspace.yaml, matching what users run.
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install

      - name: Verify better-sqlite3 prebuilt binary loads
        # pnpm-workspace.yaml skips better-sqlite3's build script and relies on the prebuilt
        # binary in the tarball. Prebuilds are per platform/arch, so a missing one would
        # otherwise surface as a confusing require error somewhere inside the test suite.
        run: node -e "require('better-sqlite3')(':memory:').prepare('select 1').get()"

      - name: Typecheck and Build
        run: pnpm run build
        
      - name: Unit Tests
        run: pnpm test
        
      - name: Decoupling Guard Test
        run: pnpm run test:decoupling
