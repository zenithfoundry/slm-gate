# Publishes the exported metrics dashboard (site/, from `pnpm run dashboard:export`)
# to GitHub Pages whenever it changes on main. Requires one-time setup:
# Settings → Pages → Source: GitHub Actions.
name: Publish dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
