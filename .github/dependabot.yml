# Weekly update PRs. The workflows pin actions to commit SHAs, and this keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Runtime dependency bumps (security updates included) are `fix(deps):`, so release-please makes a
    # patch release and lists them in its notes. Dev-only bumps stay `chore(deps-dev):` and release nothing.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
